<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老闆時段登記板</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%85</text></svg>">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "PingFang TC", "Microsoft JhengHei", "Segoe UI", system-ui, sans-serif;
    background: #FDEEDD;
    color: #1E2422;
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  header { margin-bottom: 20px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; letter-spacing: 0.2px; }
  .sub { font-size: 13px; color: #5C665F; margin: 0; }

  .datebar {
    display: flex; gap: 8px; margin: 18px 0 16px;
  }
  .datebtn {
    flex: 1 1 0; padding: 8px 6px; border-radius: 999px;
    border: 1px solid #C7CFC5; background: #fff; font-size: 13px;
    cursor: pointer; color: #445048; white-space: nowrap; text-align: center;
  }
  .datebtn.active { background: #F28500; color: #fff; border-color: #F28500; }

  .card {
    background: #fff; border: 1px solid #DDE3D8; border-radius: 12px;
    padding: 16px; margin-bottom: 12px;
  }
  .empty {
    text-align: center; color: #8A9289; font-size: 14px; padding: 28px 12px;
    border: 1px dashed #C7CFC5; border-radius: 12px; background: #FAFBF9;
  }

  .skeleton-row {
    height: 52px; border-radius: 10px; margin-bottom: 10px;
    background: linear-gradient(90deg, #EFEFEA 25%, #F8F8F5 37%, #EFEFEA 63%);
    background-size: 400% 100%;
    animation: skeleton-shimmer 1.4s ease infinite;
  }
  .skeleton-row:last-child { margin-bottom: 0; }
  @keyframes skeleton-shimmer {
    0% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fade-in 0.25s ease both; }

  .slot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .slot + .slot { border-top: 1px solid #EEF0EC; margin-top: 10px; padding-top: 10px; }
  .time { font-size: 15px; font-weight: 700; min-width: 96px; }
  .meta { flex: 1; min-width: 0; }
  .name { font-size: 14px; font-weight: 700; }
  .topic { font-size: 13px; color: #5C665F; margin-top: 2px; word-break: break-word; }
  .status-open { color: #F28500; font-size: 13px; font-weight: 700; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
  .tag-open { background: #E4EEE6; color: #1F5133; }
  .tag-yellow { background: #FCEFC7; color: #7A5B06; }
  .tag-red { background: #F9DCD6; color: #8A2A16; }

  button.action {
    border: 1px solid #F28500; background: #F28500; color: #fff;
    padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  button.action.secondary {
    background: #fff; color: #F28500;
  }
  button.action.danger {
    background: #fff; color: #A34B2E; border-color: #E0C4B6;
  }
  button.action:hover { opacity: 0.9; }

  .addform {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: #5C665F; }
  .field input {
    border: 1px solid #C7CFC5; border-radius: 8px; padding: 8px 10px; font-size: 14px;
    background: #fff;
  }
  .field input[type=time] { width: 150px; }

  h2.section { font-size: 14px; font-weight: 700; margin: 0 0 10px; color: #F28500; }

  .modal-bg {
    position: relative; margin-top: 10px; padding: 12px; background: #FAFBF9;
    border: 1px solid #DDE3D8; border-radius: 10px;
  }
  .modal-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .modal-row input { flex: 1; min-width: 140px; }
  .modal-row select {
    border: 1px solid #C7CFC5; border-radius: 8px; padding: 8px 6px; font-size: 13px;
    background: #fff; flex: 0 0 auto;
  }

  .hint { font-size: 12px; color: #8A9289; margin-top: 6px; line-height: 1.6; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #F28500; color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; opacity: 0; transition: opacity 0.25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .login-screen {
    max-width: 360px; margin: 80px auto; text-align: center;
    background: #fff; border: 1px solid #DDE3D8; border-radius: 12px;
    padding: 32px 24px;
  }
  .login-screen h2 { font-size: 16px; margin: 0 0 8px; }
  .login-screen p { font-size: 13px; color: #5C665F; margin: 0 0 20px; }
  #googleBtnContainer { display: flex; justify-content: center; }
  .login-denied { color: #A34B2E; font-size: 13px; margin-top: 14px; display: none; }
  .user-badge {
    display: flex; align-items: center; justify-content: flex-end; gap: 8px;
    font-size: 12px; color: #5C665F; margin-bottom: 6px;
  }
  .user-badge button {
    border: none; background: none; color: #8A9289; text-decoration: underline;
    cursor: pointer; font-size: 12px; padding: 0;
  }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <h2>老闆時段登記板</h2>
  <p>請使用公司 Google 帳號登入</p>
  <div id="googleBtnContainer"></div>
  <p class="login-denied" id="loginDenied">這個帳號不屬於公司網域，無法使用。</p>
</div>

<div class="wrap" id="mainApp" style="display:none;">
  <div class="user-badge">
    <span id="userBadgeText"></span>
    <button id="logoutBtn">登出</button>
  </div>
  <header>
    <h1>老闆時段登記板</h1>
    <p class="sub">手刀登記，先搶先贏，大家看到的都是同一份行程表 🏃</p>
  </header>

  <div style="display:flex; align-items:center; gap:8px; margin-top:18px;">
    <button id="prevWeekBtn" class="action secondary" style="padding:8px 12px; flex:0 0 auto;">‹</button>
    <div class="datebar" id="datebar" style="flex:1; margin:0;"></div>
    <button id="nextWeekBtn" class="action secondary" style="padding:8px 12px; flex:0 0 auto;">›</button>
  </div>
  <div style="height:16px;"></div>

  <div class="card" id="openSlotFormCard">
    <h2 class="section">開放新時段</h2>
    <p class="hint" style="margin-top:-4px;">行政或老闆本人都可以開放時段；老闆隨時可以自己新增或調整。</p>
    <div class="addform" style="margin-bottom:10px;">
      <span style="font-size:13px; font-weight:700; color:#F28500; min-width:36px;">上午</span>
      <div class="field">
        <label>開始時間</label>
        <input type="time" id="startTimeAM" value="09:00">
      </div>
      <div class="field">
        <label>結束時間</label>
        <input type="time" id="endTimeAM" value="12:00">
      </div>
      <button class="action" id="addSlotAMBtn">開放上午時段</button>
    </div>
    <div class="addform">
      <span style="font-size:13px; font-weight:700; color:#F28500; min-width:36px;">下午</span>
      <div class="field">
        <label>開始時間</label>
        <input type="time" id="startTimePM" value="14:00">
      </div>
      <div class="field">
        <label>結束時間</label>
        <input type="time" id="endTimePM" value="17:00">
      </div>
      <button class="action" id="addSlotPMBtn">開放下午時段</button>
    </div>
  </div>

  <div class="card" id="fixedEventFormCard">
    <h2 class="section">既定行程</h2>
    <p class="hint" style="margin-top:-4px;">晨會、外部會議這種老闆本來就要去的行程，加在這裡會自動佔掉那段時間，同事就不會登記到衝突的時段。</p>
    <div class="addform" style="align-items:flex-end;">
      <div class="field">
        <label>開始時間</label>
        <input type="time" id="fixedStart" value="09:00">
      </div>
      <div class="field">
        <label>結束時間</label>
        <input type="time" id="fixedEnd" value="09:30">
      </div>
      <div class="field" style="flex:1; min-width:140px;">
        <label>行程名稱</label>
        <input type="text" id="fixedTitle" placeholder="例如：晨會、外部會議" style="width:100%;">
      </div>
      <button class="action" id="addFixedEventBtn">新增既定行程</button>
    </div>
  </div>

  <div class="card" id="priorityCard" style="display:none;">
    <h2 class="section">優先登記名單（延續討論）</h2>
    <p class="hint" style="margin-top:-4px;">這些人是從前一天延續下來的，安排時段時建議優先處理。</p>
    <div id="priorityList"></div>
  </div>

  <div class="card">
    <h2 class="section">可預約時段</h2>
    <div id="openSlotList"></div>
  </div>

  <div class="card">
    <h2 class="section">已登記（依時間排序）</h2>
    <div id="bookedList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwRNRL4RyWb2h_R-k_brrroguPY8VoxKnsw82tRPofq7w4D8ZX1obxWvaUavIDGvdz5AQ/exec';
let selectedDate = todayStr();
let slots = [];
let lastSlotsSnapshot = null;
let lastPrioritySnapshot = null;
let lastFixedSnapshot = null;
let priorityQueue = [];
let fixedEvents = [];
const boardCache = {};
const priorityCache = {};
const fixedCache = {};
let pendingPriorityFill = null;

function todayStr(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return dsFromDate(d);
}

function dsFromDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

let weekOffset = 0;

function getWeekMondayFri() {
  const d = new Date();
  d.setDate(d.getDate() + weekOffset * 7);
  const dow = d.getDay(); // 0=Sun ... 6=Sat
  const diffToMon = dow === 0 ? -6 : 1 - dow;
  const monday = new Date(d);
  monday.setDate(d.getDate() + diffToMon);
  const days = [];
  for (let i = 0; i < 5; i++) {
    const day = new Date(monday);
    day.setDate(monday.getDate() + i);
    days.push(day);
  }
  return days;
}

function fmtLabel(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  const wd = ["日","一","二","三","四","五","六"][d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()}（週${wd}）`;
}

function switchToDate(ds) {
  const existingModal = document.querySelector('.modal-bg');
  if (existingModal) { modalOpen = false; existingModal.remove(); }
  selectedDate = ds;
  buildDateBar();

  if (boardCache[ds] || fixedCache[ds]) {
    slots = boardCache[ds] || [];
    fixedEvents = fixedCache[ds] || [];
    lastSlotsSnapshot = JSON.stringify(slots);
    lastFixedSnapshot = JSON.stringify(fixedEvents);
    renderSlots();
  } else {
    lastSlotsSnapshot = null;
    lastFixedSnapshot = null;
    $('openSlotList').innerHTML = skeletonHtml(2);
    $('bookedList').innerHTML = skeletonHtml(3);
  }
  if (priorityCache[ds]) {
    priorityQueue = priorityCache[ds];
    lastPrioritySnapshot = JSON.stringify(priorityQueue);
    renderPriority();
  } else {
    lastPrioritySnapshot = null;
    $('priorityCard').style.display = 'none';
  }

  loadSlots(true);
  loadFixedEvents(true);
  loadPriority(true);
}

function buildDateBar() {
  const bar = $('datebar');
  bar.innerHTML = '';
  const days = getWeekMondayFri();
  const todayDs = todayStr();
  days.forEach(day => {
    const ds = dsFromDate(day);
    const wd = ["日","一","二","三","四","五","六"][day.getDay()];
    const btn = document.createElement('button');
    btn.className = 'datebtn' + (ds === selectedDate ? ' active' : '');
    btn.textContent = `${day.getMonth()+1}/${day.getDate()}（${wd}）` + (ds === todayDs ? '・今天' : '');
    btn.onclick = () => switchToDate(ds);
    bar.appendChild(btn);
  });
}

$('prevWeekBtn').onclick = () => {
  weekOffset--;
  const days = getWeekMondayFri();
  switchToDate(dsFromDate(days[0]));
};
$('nextWeekBtn').onclick = () => {
  weekOffset++;
  const days = getWeekMondayFri();
  switchToDate(dsFromDate(days[0]));
};

function skeletonHtml(count) {
  count = count || 2;
  let html = '';
  for (let i = 0; i < count; i++) html += '<div class="skeleton-row"></div>';
  return html;
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function loadSlots(force) {
  if (!force && (modalOpen || saveInFlight > 0)) return;
  const dateAtRequest = selectedDate;
  let fetched;
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=get&key=${encodeURIComponent('board:' + dateAtRequest)}`);
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    fetched = data && data.value ? JSON.parse(data.value) : [];
  } catch (e) {
    // 抓資料失敗（Apps Script 偶爾會這樣）：保留原本畫面，安靜等下一次自動重試，不要清空畫面造成閃爍
    return;
  }
  boardCache[dateAtRequest] = fetched;
  if (dateAtRequest !== selectedDate) return; // 使用者在等待回應時已經切換日期，這筆資料過期了，只更新快取，畫面不動
  const snapshot = JSON.stringify(fetched);
  if (snapshot === lastSlotsSnapshot) return; // 資料跟畫面上顯示的一樣，不用重畫，避免閃爍
  lastSlotsSnapshot = snapshot;
  slots = fetched;
  renderSlots();
}

async function loadPriority(force) {
  if (!force && (modalOpen || saveInFlight > 0)) return;
  const dateAtRequest = selectedDate;
  let fetched;
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=get&key=${encodeURIComponent('priority:' + dateAtRequest)}`);
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    fetched = data && data.value ? JSON.parse(data.value) : [];
  } catch (e) {
    return;
  }
  priorityCache[dateAtRequest] = fetched;
  if (dateAtRequest !== selectedDate) return; // 使用者在等待回應時已經切換日期，這筆資料過期了，丟掉
  const snapshot = JSON.stringify(fetched);
  if (snapshot === lastPrioritySnapshot) return;
  lastPrioritySnapshot = snapshot;
  priorityQueue = fetched;
  renderPriority();
}

async function loadFixedEvents(force) {
  if (!force && (modalOpen || saveInFlight > 0)) return;
  const dateAtRequest = selectedDate;
  let fetched;
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=get&key=${encodeURIComponent('fixed:' + dateAtRequest)}`);
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    fetched = data && data.value ? JSON.parse(data.value) : [];
  } catch (e) {
    return;
  }
  fixedCache[dateAtRequest] = fetched;
  if (dateAtRequest !== selectedDate) return;
  const snapshot = JSON.stringify(fetched);
  if (snapshot === lastFixedSnapshot) return;
  lastFixedSnapshot = snapshot;
  fixedEvents = fetched;
  renderSlots();
}

async function saveFixedEvents() {
  saveInFlight++;
  try {
    const key = 'fixed:' + selectedDate;
    const value = JSON.stringify(fixedEvents);
    const res = await fetch(`${APPS_SCRIPT_URL}?action=set&key=${encodeURIComponent(key)}&value=${encodeURIComponent(value)}`);
    const data = await res.json();
    if (!data || !data.ok) throw new Error('save failed');
  } catch (e) {
    showToast('儲存失敗，請重試');
  } finally {
    saveInFlight--;
  }
}

async function savePriorityQueueForDate(dateStr, list) {
  saveInFlight++;
  try {
    const key = 'priority:' + dateStr;
    const value = JSON.stringify(list);
    const res = await fetch(`${APPS_SCRIPT_URL}?action=set&key=${encodeURIComponent(key)}&value=${encodeURIComponent(value)}`);
    const data = await res.json();
    if (!data || !data.ok) throw new Error('save failed');
  } catch (e) {
    showToast('操作失敗，請重試');
  } finally {
    saveInFlight--;
  }
}

// 把一筆延續討論加進「某一天」的優先名單，可以是不同於目前畫面上顯示的日期（例如今天延到明天）
async function addToPriorityQueue(dateStr, item) {
  let list = [];
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=get&key=${encodeURIComponent('priority:' + dateStr)}`);
    const data = await res.json();
    list = data && data.value ? JSON.parse(data.value) : [];
  } catch (e) {
    // 讀不到就當作空清單，直接用新的一筆蓋掉；機率很低且影響不大
  }
  list.push(item);
  await savePriorityQueueForDate(dateStr, list);
  if (dateStr === selectedDate) {
    priorityQueue = list;
    renderPriority();
  }
}

async function removeFromPriorityQueue(priorityId) {
  priorityQueue = priorityQueue.filter(p => p.id !== priorityId);
  renderPriority();
  savePriorityQueueForDate(selectedDate, priorityQueue);
}

function dateOffset(ds) {
  const target = new Date(ds + 'T00:00:00');
  const today = new Date(todayStr() + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

async function saveSlots() {
  saveInFlight++;
  try {
    const key = 'board:' + selectedDate;
    const value = JSON.stringify(slots);
    const res = await fetch(`${APPS_SCRIPT_URL}?action=set&key=${encodeURIComponent(key)}&value=${encodeURIComponent(value)}`);
    const data = await res.json();
    if (!data || !data.ok) throw new Error('save failed');
  } catch (e) {
    showToast('儲存失敗，請重試');
  } finally {
    saveInFlight--;
  }
}

const DURATIONS = [15, 30, 45, 60];
let modalOpen = false;
let saveInFlight = 0;

function toMinutes(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}
function toTimeStr(mins) {
  const h = Math.floor(mins / 60).toString().padStart(2, '0');
  const m = (mins % 60).toString().padStart(2, '0');
  return `${h}:${m}`;
}

function freeWindows(block) {
  const blockStart = toMinutes(block.start);
  const blockEnd = toMinutes(block.end);
  const busy = (block.bookings || []).map(b => ({ start: toMinutes(b.start), end: toMinutes(b.end) }))
    .concat(
      (fixedEvents || [])
        .map(f => ({ start: toMinutes(f.start), end: toMinutes(f.end) }))
        .filter(f => f.start < blockEnd && f.end > blockStart)
        .map(f => ({ start: Math.max(f.start, blockStart), end: Math.min(f.end, blockEnd) }))
    )
    .sort((a, b) => a.start - b.start);

  const windows = [];
  let cursor = blockStart;
  busy.forEach(b => {
    if (b.start > cursor) windows.push([cursor, b.start]);
    cursor = Math.max(cursor, b.end);
  });
  if (cursor < blockEnd) windows.push([cursor, blockEnd]);
  return windows;
}

function getStartOptions(block, duration) {
  const windows = freeWindows(block);
  const options = [];
  windows.forEach(([ws, we]) => {
    for (let t = ws; t + duration <= we; t += 15) {
      options.push(toTimeStr(t));
    }
  });
  return options;
}

function renderSlots() {
  lastSlotsSnapshot = JSON.stringify(slots);
  const openList = $('openSlotList');
  const bookedList = $('bookedList');

  // ===== 可預約時段區塊 =====
  if (!slots.length) {
    openList.innerHTML = '<div class="empty">目前沒有開放的時段，先用上面的表單開放一個吧。</div>';
  } else {
    const sortedBlocks = [...slots].sort((a, b) => a.start.localeCompare(b.start));
    openList.innerHTML = '';
    sortedBlocks.forEach(block => {
      const hasRoom = getStartOptions(block, 15).length > 0;
      const row = document.createElement('div');
      row.className = 'slot fade-in';
      row.innerHTML = `
        <div class="time">${block.start}–${block.end}</div>
        <div class="meta"><span class="status-open">${hasRoom ? '開放中 <span class=\"tag tag-open\">可登記</span>' : '已額滿'}</span></div>
        ${hasRoom ? `<button class="action" data-id="${block.id}" data-act="book">登記</button>` : ''}
        ${isAdmin ? `<button class="action danger" data-id="${block.id}" data-act="remove">刪除整段</button>` : ''}
      `;
      openList.appendChild(row);
    });
    openList.querySelectorAll('button[data-act]').forEach(btn => {
      btn.onclick = () => handleAction(btn.dataset.id, btn.dataset.act, btn);
    });
  }

  // ===== 已登記名單（依時序，含既定行程） =====
  const timeline = [];
  slots.forEach(block => {
    (block.bookings || []).forEach(bk => {
      timeline.push({ ...bk, blockId: block.id, _type: 'booking' });
    });
  });
  (fixedEvents || []).forEach(f => {
    timeline.push({ ...f, _type: 'fixed' });
  });
  timeline.sort((a, b) => toMinutes(a.start) - toMinutes(b.start));

  if (!timeline.length) {
    bookedList.innerHTML = '<div class="empty">目前還沒有人登記。</div>';
    return;
  }

  bookedList.innerHTML = '';
  let bookingCounter = 0;
  timeline.forEach(item => {
    const row = document.createElement('div');
    if (item._type === 'fixed') {
      row.className = 'slot fade-in';
      row.style.cssText = 'background:#978166; color:#fff; border-radius:8px; padding:10px 12px; margin-top:10px; border-top:none;';
      row.innerHTML = `
        <div class="time" style="color:#fff;">${item.start}–${item.end}</div>
        <div class="meta"><div class="name" style="color:#fff;">${escapeHtml(item.title)}</div></div>
        ${isAdmin ? `<button class="action secondary" data-id="${item.id}" data-act="deleteFixed" style="background:#fff;color:#978166;border-color:#fff;">刪除</button>` : ''}
      `;
    } else {
      bookingCounter++;
      const urgencyLabel = item.urgency === 'red' ? '緊急' : '普通';
      const carriedTag = item.carriedOver ? '<span class="tag" style="background:#EAEAE7;color:#5C665F;">已延至隔天</span>' : '';
      row.className = 'slot fade-in';
      row.innerHTML = `
        <div class="time" style="display:flex; align-items:center; gap:6px;">
          <span style="display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:999px; background:#F28500; color:#fff; font-size:12px; font-weight:700; flex-shrink:0;">${bookingCounter}</span>
          <span>${item.start}–${item.end}</span>
        </div>
        <div class="meta">
          <div class="name">${escapeHtml(item.name)} <span class="tag tag-${item.urgency === 'red' ? 'red' : 'yellow'}">${urgencyLabel}</span> ${carriedTag}</div>
          <div class="topic">${escapeHtml(item.topic || '（未填主題）')}</div>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="action secondary" data-blockid="${item.blockId}" data-bookingid="${item.id}" data-act="edit">編輯</button>
          ${!item.carriedOver ? `<button class="action secondary" data-blockid="${item.blockId}" data-bookingid="${item.id}" data-act="carryOver">延到隔天</button>` : ''}
          <button class="action danger" data-blockid="${item.blockId}" data-bookingid="${item.id}" data-act="cancelBooking">取消</button>
        </div>
      `;
    }
    bookedList.appendChild(row);
  });
  bookedList.querySelectorAll('button[data-act="cancelBooking"]').forEach(btn => {
    btn.onclick = () => cancelBooking(btn.dataset.blockid, btn.dataset.bookingid);
  });
  bookedList.querySelectorAll('button[data-act="carryOver"]').forEach(btn => {
    btn.onclick = () => carryOverBooking(btn.dataset.blockid, btn.dataset.bookingid);
  });
  bookedList.querySelectorAll('button[data-act="edit"]').forEach(btn => {
    btn.onclick = () => openEditForm(btn.dataset.blockid, btn.dataset.bookingid, btn);
  });
  bookedList.querySelectorAll('button[data-act="deleteFixed"]').forEach(btn => {
    btn.onclick = () => deleteFixedEvent(btn.dataset.id);
  });
}

function renderPriority() {
  lastPrioritySnapshot = JSON.stringify(priorityQueue);
  const card = $('priorityCard');
  const list = $('priorityList');
  if (!priorityQueue.length) {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';
  list.innerHTML = '';
  priorityQueue.forEach(p => {
    const urgencyLabel = p.urgency === 'red' ? '緊急' : '普通';
    const row = document.createElement('div');
    row.className = 'slot fade-in';
    row.innerHTML = `
      <div class="meta">
        <div class="name">${escapeHtml(p.name)} <span class="tag tag-${p.urgency === 'red' ? 'red' : 'yellow'}">${urgencyLabel}</span></div>
        <div class="topic">${escapeHtml(p.topic || '（未填主題）')}（延續自 ${p.fromDate || '昨天'}）</div>
      </div>
      <button class="action" data-id="${p.id}" data-act="fillPriority">登記進時段</button>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('button[data-act="fillPriority"]').forEach(btn => {
    btn.onclick = () => {
      const item = priorityQueue.find(p => p.id === btn.dataset.id);
      if (!item) return;
      pendingPriorityFill = item;
      showToast('已幫你帶入資料，請點下方任一開放時段的「登記」按鈕');
    };
  });
}

function carryOverBooking(blockId, bookingId) {
  const block = slots.find(s => s.id === blockId);
  if (!block) return;
  const bk = (block.bookings || []).find(b => b.id === bookingId);
  if (!bk) return;
  bk.carriedOver = true;
  renderSlots();
  saveSlots();

  const nextDate = dsFromDate(new Date(new Date(selectedDate + 'T00:00:00').getTime() + 86400000));
  addToPriorityQueue(nextDate, {
    id: 'p' + Date.now() + Math.random().toString(36).slice(2, 6),
    name: bk.name, topic: bk.topic, urgency: bk.urgency, fromDate: selectedDate
  });
  showToast('已加入隔天的優先登記名單');
}

function openEditForm(blockId, bookingId, btnEl) {
  const existing = document.querySelector('.modal-bg');
  if (existing) existing.remove();
  const block = slots.find(s => s.id === blockId);
  const bk = block && (block.bookings || []).find(b => b.id === bookingId);
  if (!bk) return;
  modalOpen = true;

  const box = document.createElement('div');
  box.className = 'modal-bg';
  box.innerHTML = `
    <div class="modal-row" style="align-items:center;">
      <span style="font-size:13px; font-weight:700; color:#F28500; min-width:80px;">${bk.start}–${bk.end}</span>
      <input type="text" id="editName" value="${escapeHtml(bk.name)}" placeholder="名字" style="flex:1; min-width:100px;">
      <select id="editUrgency" style="width:80px;">
        <option value="yellow" ${bk.urgency !== 'red' ? 'selected' : ''}>普通</option>
        <option value="red" ${bk.urgency === 'red' ? 'selected' : ''}>緊急</option>
      </select>
    </div>
    <div class="modal-row">
      <input type="text" id="editTopic" value="${escapeHtml(bk.topic || '')}" placeholder="想討論的主題" style="flex:1;">
    </div>
    <div style="display:flex; gap:8px;">
      <button class="action" id="editConfirm">儲存</button>
      <button class="action secondary" id="editCancel">取消</button>
    </div>
  `;
  btnEl.closest('.slot').after(box);

  function closeModal() { modalOpen = false; box.remove(); }

  $('editConfirm').onclick = () => {
    const name = $('editName').value.trim();
    if (!name) { showToast('請填寫名字'); return; }
    bk.name = name;
    bk.topic = $('editTopic').value.trim();
    bk.urgency = $('editUrgency').value;
    closeModal();
    renderSlots();
    showToast('已更新');
    saveSlots();
  };
  $('editCancel').onclick = closeModal;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function handleAction(id, act, btnEl) {
  if (act === 'remove') {
    slots = slots.filter(s => s.id !== id);
    renderSlots();
    saveSlots();
    return;
  }
  if (act === 'book') {
    openBookForm(id, btnEl);
  }
}

function cancelBooking(blockId, bookingId) {
  const block = slots.find(s => s.id === blockId);
  if (!block) return;
  block.bookings = (block.bookings || []).filter(b => b.id !== bookingId);
  renderSlots();
  saveSlots();
}

function openBookForm(id, btnEl) {
  const existing = document.querySelector('.modal-bg');
  if (existing) existing.remove();
  const block = slots.find(s => s.id === id);
  modalOpen = true;

  const box = document.createElement('div');
  box.className = 'modal-bg';

  function durationOptionsHtml(selected) {
    return DURATIONS.map(d => `<option value="${d}" ${d === selected ? 'selected' : ''}>${d}分鐘</option>`).join('');
  }

  function startOptionsHtml(duration) {
    const opts = getStartOptions(block, duration);
    if (!opts.length) return '<option value="">這個時長已無空檔</option>';
    return opts.map(t => `<option value="${t}">${t}</option>`).join('');
  }

  const prefill = pendingPriorityFill;

  box.innerHTML = `
    <div class="modal-row" style="align-items:center;">
      <select id="tmpStart" style="width:90px;">${startOptionsHtml(30)}</select>
      <select id="tmpDuration" style="width:90px;">${durationOptionsHtml(30)}</select>
      <input type="text" id="tmpName" placeholder="你的名字" value="${escapeHtml((prefill && prefill.name) || window.currentUserName || '')}" style="flex:1; min-width:100px;">
      <select id="tmpUrgency" style="width:80px;">
        <option value="yellow" ${prefill && prefill.urgency !== 'red' ? 'selected' : ''}>普通</option>
        <option value="red" ${prefill && prefill.urgency === 'red' ? 'selected' : ''}>緊急</option>
      </select>
    </div>
    <div class="modal-row">
      <input type="text" id="tmpTopic" placeholder="想討論的主題（一句話即可）" value="${escapeHtml((prefill && prefill.topic) || '')}" style="flex:1;">
    </div>
    ${prefill ? '<p class="hint" style="margin:-4px 0 8px;">已帶入延續登記的資料，登記後會自動從優先名單移除。</p>' : ''}
    <div style="display:flex; gap:8px;">
      <button class="action" id="tmpConfirm">確認登記</button>
      <button class="action secondary" id="tmpCancel">取消</button>
    </div>
  `;
  btnEl.closest('.slot').after(box);

  $('tmpDuration').onchange = () => {
    const duration = Number($('tmpDuration').value);
    $('tmpStart').innerHTML = startOptionsHtml(duration);
  };

  function closeModal() {
    modalOpen = false;
    box.remove();
  }

  $('tmpConfirm').onclick = () => {
    const name = $('tmpName').value.trim();
    const topic = $('tmpTopic').value.trim();
    const start = $('tmpStart').value;
    const duration = Number($('tmpDuration').value);
    const urgency = $('tmpUrgency').value;
    if (!name) { showToast('請先填寫名字'); return; }
    if (!start) { showToast('這個時長沒有空檔了，請換一個時長'); return; }
    const end = toTimeStr(toMinutes(start) + duration);
    const target = slots.find(s => s.id === id);
    const stillFree = getStartOptions(target, duration).includes(start);
    if (!stillFree) { showToast('這個時間剛被別人搶先登記了，請重新選擇'); $('tmpStart').innerHTML = startOptionsHtml(duration); return; }
    target.bookings = target.bookings || [];
    target.bookings.push({
      id: 'b' + Date.now() + Math.random().toString(36).slice(2, 6),
      start, end, name, topic, urgency
    });
    if (prefill) {
      removeFromPriorityQueue(prefill.id);
      pendingPriorityFill = null;
    }
    closeModal();
    renderSlots();
    showToast('登記成功');
    saveSlots();
  };
  $('tmpCancel').onclick = () => { pendingPriorityFill = null; closeModal(); };
}

function addSlotFromInputs(startId, endId) {
  const start = $(startId).value;
  const end = $(endId).value;
  if (!start || !end || start >= end) { showToast('請確認開始與結束時間'); return; }
  slots.push({ id: 's' + Date.now() + Math.random().toString(36).slice(2,6), start, end, bookings: [] });
  renderSlots();
  saveSlots();
}

$('addSlotAMBtn').onclick = () => addSlotFromInputs('startTimeAM', 'endTimeAM');
$('addSlotPMBtn').onclick = () => addSlotFromInputs('startTimePM', 'endTimePM');

function addFixedEvent() {
  const start = $('fixedStart').value;
  const end = $('fixedEnd').value;
  const title = $('fixedTitle').value.trim();
  if (!start || !end || start >= end) { showToast('請確認開始與結束時間'); return; }
  if (!title) { showToast('請填寫行程名稱'); return; }
  fixedEvents.push({
    id: 'f' + Date.now() + Math.random().toString(36).slice(2, 6),
    start, end, title
  });
  $('fixedTitle').value = '';
  renderSlots();
  saveFixedEvents();
}

function deleteFixedEvent(id) {
  fixedEvents = fixedEvents.filter(f => f.id !== id);
  renderSlots();
  saveFixedEvents();
}

$('addFixedEventBtn').onclick = addFixedEvent;

// ===== Google 登入（限制公司網域） =====
// 設定步驟：
// 1. 到 https://console.cloud.google.com/ 建一個專案（或用現有的）
// 2. 「API 和服務」→「憑證」→「建立憑證」→「OAuth 用戶端 ID」，類型選「網頁應用程式」
// 3. 「已授權的 JavaScript 來源」填入這個網頁實際的網址（例如 https://claude.ai 或你發布後的網址）
// 4. 建立後會拿到一組 Client ID，貼到下面 GOOGLE_CLIENT_ID
// 5. ALLOWED_DOMAINS 改成公司 Google 帳號的網域（可以填多個）
const GOOGLE_CLIENT_ID = '760769778758-3um9llcqo5jfsc3klsi6t68v1uc0hvfr.apps.googleusercontent.com';
const ALLOWED_DOMAINS = ['w-power.com.tw', 'wenergy.com.tw'];

// 「開放新時段」「刪除整段」只開放給下面這些 email（行政、老闆）
// 把實際的帳號填進來，例如 ['boss@w-power.com.tw', 'admin@wenergy.com.tw']
const ADMIN_EMAILS = [
  'rusen.wu@wenergy.com.tw',
  'belinda.yeh@wenergy.com.tw',
  'avon.cheng@wenergy.com.tw',
  'miac@w-power.com.tw'
];

let isAdmin = false;

function applyRolePermissions(email) {
  isAdmin = ADMIN_EMAILS.map(e => e.toLowerCase()).includes((email || '').toLowerCase());
  $('openSlotFormCard').style.display = isAdmin ? 'block' : 'none';
  $('fixedEventFormCard').style.display = isAdmin ? 'block' : 'none';
}

function decodeJwt(token) {
  try {
    const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(atob(base64).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
    ).join('')));
  } catch (e) {
    return null;
  }
}

function handleGoogleLogin(response) {
  const payload = decodeJwt(response.credential);
  if (!payload) { showToast('登入解析失敗，請重試'); return; }
  const email = payload.email || '';
  const domain = (email.split('@')[1] || '').toLowerCase();
  const allowed = ALLOWED_DOMAINS.some(d => d.toLowerCase() === domain);
  if (!allowed) {
    $('loginDenied').style.display = 'block';
    return;
  }
  $('loginDenied').style.display = 'none';
  $('loginScreen').style.display = 'none';
  $('mainApp').style.display = 'block';
  $('userBadgeText').textContent = `${payload.name || email}（${email}）`;
  window.currentUserName = payload.name || email;
  applyRolePermissions(email);
  try {
    localStorage.setItem('boardUser', JSON.stringify({
      name: payload.name || email, email, ts: Date.now()
    }));
  } catch (e) {}
  initApp();
}

$('logoutBtn').onclick = () => {
  try { localStorage.removeItem('boardUser'); } catch (e) {}
  $('mainApp').style.display = 'none';
  $('loginScreen').style.display = 'block';
  if (window.google && google.accounts && google.accounts.id) {
    google.accounts.id.disableAutoSelect();
  }
};

const SESSION_DAYS = 7;

function tryRestoreSession() {
  try {
    const raw = localStorage.getItem('boardUser');
    if (!raw) return false;
    const saved = JSON.parse(raw);
    const domain = (saved.email.split('@')[1] || '').toLowerCase();
    const allowed = ALLOWED_DOMAINS.some(d => d.toLowerCase() === domain);
    const notExpired = (Date.now() - saved.ts) < SESSION_DAYS * 24 * 60 * 60 * 1000;
    if (!allowed || !notExpired) {
      localStorage.removeItem('boardUser');
      return false;
    }
    $('loginScreen').style.display = 'none';
    $('mainApp').style.display = 'block';
    $('userBadgeText').textContent = `${saved.name}（${saved.email}）`;
    window.currentUserName = saved.name;
    applyRolePermissions(saved.email);
    initApp();
    return true;
  } catch (e) {
    return false;
  }
}

function startGoogleButton(retriesLeft) {
  if (retriesLeft === undefined) retriesLeft = 25;
  if (window.google && google.accounts && google.accounts.id) {
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleGoogleLogin
    });
    google.accounts.id.renderButton($('googleBtnContainer'), { theme: 'outline', size: 'large', text: 'signin_with' });
    return;
  }
  // Google 的登入腳本可能還沒載入完，稍等一下再試，最多重試 25 次（約 5 秒）
  if (retriesLeft > 0) {
    setTimeout(() => startGoogleButton(retriesLeft - 1), 200);
  }
}

window.onload = () => {
  if (tryRestoreSession()) return;
  startGoogleButton();
};

function initApp() {
  buildDateBar();
  loadSlots(true);
  loadFixedEvents(true);
  loadPriority(true);
  if (!window._pollingStarted) {
    window._pollingStarted = true;
    setInterval(loadSlots, 8000);
    setInterval(loadFixedEvents, 8000);
    setInterval(loadPriority, 8000);
  }
}
